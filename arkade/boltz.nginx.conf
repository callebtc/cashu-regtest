server {
    listen 80;
    location /v2/ws {
        proxy_pass http://arkade-boltz-backend:9004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
    }
    location / {
        proxy_pass http://arkade-boltz-backend:9001;
    }
}
