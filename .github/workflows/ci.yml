name: regtest

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  arkade-regtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v3
      - name: Prove Arkade onchain and Lightning payments
        run: |
          chmod -R 777 .
          bash ./start.sh --arkade
      - name: Arkade failure diagnostics
        if: failure()
        env:
          COMPOSE_PROJECT_NAME: cashu
        run: |
          docker compose --profile "*" ps -a
          docker compose --profile "*" logs --tail=200 arkade-operator arkade-operator-wallet arkade-fulmine arkade-boltz-backend arkade-nbxplorer spark-electrs bitcoind lnd-2
          source ./docker-scripts.sh
          fee-diagnostics

  regtest:
    runs-on: "ubuntu-latest"
    # A cold native Rust build of the default LDK Node daemon takes longer.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v3
      - name: Setup Regtest
        run: |
          bash tests/startup.sh
          chmod -R 777 .
          bash ./start.sh
      - name: Fee topology failure diagnostics
        if: failure()
        run: |
          source ./docker-scripts.sh
          fee-diagnostics

  spark-regtest:
    runs-on: "ubuntu-latest"
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v3
      - name: Prove Breez Spark onchain and Lightning payments
        run: |
          chmod -R 777 .
          bash ./start.sh --spark
      - name: Fee topology failure diagnostics
        if: failure()
        run: |
          source ./docker-scripts.sh
          fee-diagnostics

  bark-regtest:
    runs-on: "ubuntu-latest"
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v3
      - name: Setup Bark Regtest and prove wallet payments
        run: |
          chmod -R 777 .
          docker compose --profile bark build bark-cln
          bash tests/bark-cln-startup.sh
          bash ./start.sh --bark
      - name: Bark failure diagnostics
        if: failure()
        env:
          COMPOSE_PROJECT_NAME: cashu
        run: |
          docker compose --profile bark ps -a
          docker compose --profile bark logs --tail=250 bark-server bark-cln bark-postgres bitcoind lnd-1
          source ./docker-scripts.sh
          fee-diagnostics
