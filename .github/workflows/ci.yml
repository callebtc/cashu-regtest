name: regtest

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  regtest:
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3
      - name: Setup Regtest
        run: |
          bash tests/startup.sh
          chmod -R 777 .
          bash ./start.sh

  spark-regtest:
    runs-on: "ubuntu-latest"
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v3
      - name: Setup Spark Regtest
        run: |
          chmod -R 777 .
          bash ./start.sh --spark
